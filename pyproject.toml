[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stat664-quantile-data"
version = "0.1.0"
description = "Bounded synthetic data with known piecewise-linear conditional quantiles"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy"]

[project.optional-dependencies]
plot = ["matplotlib"]

[tool.setuptools.packages.find]
include = ["synthetic_data*"]
